apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-viewer
  namespace: homelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homelab-viewer
  namespace: homelab
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homelab-viewer
  namespace: homelab
subjects:
  - kind: ServiceAccount
    name: homelab-viewer
    namespace: homelab
roleRef:
  kind: Role
  name: homelab-viewer
  apiGroup: rbac.authorization.k8s.io
