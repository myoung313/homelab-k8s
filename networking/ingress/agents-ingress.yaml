# LAN-only hostnames. Add both to your DNS (pfSense/router host overrides) pointing at a node IP.
# Before exposing anything to the internet, add TLS and use a Cloudflare Tunnel instead of port-forwarding.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agents
  namespace: agents
spec:
  ingressClassName: traefik
  rules:
    - host: agents.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentos-console
                port:
                  number: 80
    - host: n8n.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 80
