apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: agents
data:
  # Runs once, on first start with an empty volume.
  10-n8n.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<SQL
    CREATE USER n8n WITH PASSWORD '${N8N_DB_PASSWORD}';
    CREATE DATABASE n8n OWNER n8n;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agents
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: agents
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        agentos/data: "true"
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          # Prefer the node whose VM disk lives on pve01's NVMe (see docs/ai-agents/PROXMOX-PLAN.md).
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: homelab.tazlab/tier
                    operator: In
                    values: ["data"]
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: agentos
            - name: POSTGRES_DB
              value: agentos
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: agentos-secrets, key: POSTGRES_PASSWORD }
            - name: N8N_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: agentos-secrets, key: N8N_DB_PASSWORD }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agentos", "-d", "agentos"]
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
