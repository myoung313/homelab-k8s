apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents

resources:
  - postgres.yaml
  - redis.yaml
  - n8n.yaml
  - ollama.yaml
  - runtime.yaml
  - backup.yaml

configMapGenerator:
  # Editing roster.yaml and re-applying rolls the runtime pods automatically (hash suffix).
  - name: agentos-roster
    files:
      - roster.yaml
  - name: agentos-config
    literals:
      - AGENTOS_PHASE=1
      - GLOBAL_DAILY_BUDGET_USD=10
      - WORKER_CONCURRENCY=4
      - TZ=America/New_York
      - LOG_LEVEL=INFO
