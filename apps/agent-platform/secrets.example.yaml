# Copy to secrets.yaml (git-ignored), fill in real values, then:
#   kubectl apply -f apps/agent-platform/secrets.yaml
# Generate random values with: openssl rand -hex 24
# Later: switch to SOPS or Sealed Secrets so this can live in Git encrypted.
apiVersion: v1
kind: Secret
metadata:
  name: agentos-secrets
  namespace: agents
type: Opaque
stringData:
  # Anthropic Console > API keys. Set a monthly spend limit in the Console as a backstop.
  ANTHROPIC_API_KEY: "sk-ant-REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "postgresql://agentos:REPLACE_ME@postgres:5432/agentos"
  REDIS_PASSWORD: "REPLACE_ME"
  REDIS_URL: "redis://:REPLACE_ME@redis:6379/0"
  CONSOLE_PASSWORD: "REPLACE_ME"
  N8N_DB_PASSWORD: "REPLACE_ME"
  N8N_ENCRYPTION_KEY: "REPLACE_ME"
