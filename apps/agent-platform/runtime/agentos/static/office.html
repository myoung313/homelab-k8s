<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Dungeon</title>
<style>
  :root { --bg:#0b0a10; --panel:#16131f; --line:#2c2639; --fg:#ece6d6; --muted:#9c93ad; --gold:#e9c46a; --ok:#6fcf97; --bad:#ef6a6a; --warn:#f2a541; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace }
  header { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel) }
  header h1 { font-size:16px; margin:0; color:var(--gold); letter-spacing:.5px; transition:color .4s }
  header .stat b { color:var(--gold) }
  header a { color:var(--gold) }
  #paused { display:none; color:var(--bad); font-weight:bold }
  #conn { margin-left:auto; color:var(--muted); font-size:12px }
  #season { color:var(--gold); font-weight:bold }
  select { font:inherit; font-size:12px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:3px 6px }
  main { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; padding:16px; max-width:1400px; margin:0 auto }
  @media (max-width: 900px) { main { grid-template-columns:1fr } }
  #mapwrap { background:#07060a; border:1px solid var(--line); border-radius:8px; padding:8px }
  canvas { display:block; width:100%; height:auto; cursor:pointer }
  aside { display:flex; flex-direction:column; gap:12px; min-width:0 }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px }
  .box h2 { font-size:13px; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:1px }
  #card .big { font-size:40px; line-height:1 }
  #card .name { color:var(--gold); font-weight:bold; margin-top:6px }
  #card .row { color:var(--muted); font-size:12px }
  #card .task { margin-top:8px; white-space:pre-wrap; word-break:break-word }
  #log { list-style:none; margin:0; padding:0; max-height:420px; overflow:auto; font-size:12px }
  #log li { padding:4px 0; border-bottom:1px solid var(--line); word-break:break-word }
  #log .t { color:var(--muted) }
  .legend { font-size:12px; color:var(--muted) }
</style>
</head>
<body>
<header>
  <h1>🏰 Agent Dungeon</h1>
  <span id="season"></span>
  <span class="stat">Spend today <b id="spent">–</b></span>
  <span class="stat">Waiting on you <a id="pending" href="/">–</a></span>
  <span id="paused">⛔ FLEET PAUSED</span>
  <a href="/">← Mission Control</a>
  <span id="conn">connecting…</span>
  <label class="stat">Theme <select id="theme"><option value="auto">Auto (season)</option></select></label>
</header>
<main>
  <div id="mapwrap"><canvas id="map" aria-label="Top-down dungeon map of the agent team"></canvas></div>
  <aside>
    <div class="box" id="card"><h2>Adventurer</h2><div class="row">Click an agent on the map.</div></div>
    <div class="box"><h2>Quest log</h2><ul id="log"></ul></div>
    <div class="box legend">
      ⚒ working at the station · ⏳ queued · ❗ waiting on your approval · 💥 last task failed · 📜 handoff in flight · 🔒 department unlocks in a later phase
    </div>
  </aside>
</main>
<script src="/office.js"></script>
</body>
</html>
