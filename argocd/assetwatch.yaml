
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: assetwatch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:myoung313/homelab-k8s.git
    targetRevision: HEAD
    path: apps/assetwatch
  destination:
    server: https://kubernetes.default.svc
    namespace: assetwatch
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
